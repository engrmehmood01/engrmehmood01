name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download cards
        run: |
          mkdir -p assets

          # Streak card (uses token to avoid rate limits)
          curl -L "https://streak-stats.demolab.com?user=engrmehmood01&hide_border=true" \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -o assets/streak.svg

          # GitHub stats card (use an active mirror; your previous vercel endpoint was paused)
          curl -L "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api?username=engrmehmood01&show_icons=true&hide_border=true" \
            -o assets/stats.svg

          # Top languages card (same mirror)
          curl -L "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api/top-langs/?username=engrmehmood01&layout=compact&hide_border=true" \
            -o assets/langs.svg

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "Update stats cards" || exit 0
          git push
